<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICRA - ChatGPT Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="new-chat" onclick="startNewChat()">+ New Chat</div>
    <div class="chat-title">ICRA Assistant</div>
  </aside>

  <!-- Main Chat -->
  <main class="main">
    <div id="chatContainer" class="chat-container">
      <div class="welcome">
        <h1>ICRA</h1>
        <p>How can I help you today?</p>
      </div>
    </div>

    <form id="chatForm" class="input-area">
      <input 
        type="text" 
        id="questionInput" 
        placeholder="Message ICRA..." 
        autocomplete="off"
